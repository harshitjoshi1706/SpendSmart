services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      PORT: 8000
      MONGODBURI: mongodb://mongo:27017/spendsmart
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the repository root .env file}
      NODE_ENV: production
      CLIENT_URL: http://localhost:3000
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:80"

volumes:
  mongo_data:
  uploads_data:
